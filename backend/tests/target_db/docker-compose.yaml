version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-wandasql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: wandasql_test
    ports:
      - "13306:3306"   # 仅允许本地访问
    volumes:
      - wandasql_mysql_data:/var/lib/mysql
    command:
      --default-authentication-plugin=mysql_native_password

volumes:
  wandasql_mysql_data: